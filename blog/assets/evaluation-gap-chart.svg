<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" style="max-width: 100%; height: auto; font-family: 'Inter', system-ui, sans-serif" role="img" aria-label="Bar chart showing the AI agent evaluation gap: 57.3% have agents in production, but only 52.4% run offline evaluations and 37.3% run online evaluations">
  <title>The Agent Evaluation Gap (2025)</title>
  <desc>Bar chart comparing the percentage of organizations with agents in production (57.3%), those running offline evaluations (52.4%), and those running online evaluations (37.3%). Source: LangChain State of Agent Engineering, 2025.</desc>

  <!-- Grid lines -->
  <line x1="120" y1="60" x2="520" y2="60" stroke="#1f2937" opacity="0.08" />
  <line x1="120" y1="110" x2="520" y2="110" stroke="#1f2937" opacity="0.08" />
  <line x1="120" y1="160" x2="520" y2="160" stroke="#1f2937" opacity="0.08" />
  <line x1="120" y1="210" x2="520" y2="210" stroke="#1f2937" opacity="0.08" />
  <line x1="120" y1="260" x2="520" y2="260" stroke="#1f2937" opacity="0.08" />

  <!-- Title -->
  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">The Agent Evaluation Gap</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#1f2937" opacity="0.45">% of organizations (n=1,340)</text>

  <!-- Y-axis labels -->
  <text x="115" y="65" text-anchor="end" font-size="10" fill="#1f2937" opacity="0.6">100%</text>
  <text x="115" y="115" text-anchor="end" font-size="10" fill="#1f2937" opacity="0.6">80%</text>
  <text x="115" y="165" text-anchor="end" font-size="10" fill="#1f2937" opacity="0.6">60%</text>
  <text x="115" y="215" text-anchor="end" font-size="10" fill="#1f2937" opacity="0.6">40%</text>
  <text x="115" y="265" text-anchor="end" font-size="10" fill="#1f2937" opacity="0.6">20%</text>

  <!-- Axis -->
  <line x1="120" y1="60" x2="120" y2="310" stroke="#1f2937" opacity="0.3" />
  <line x1="120" y1="310" x2="520" y2="310" stroke="#1f2937" opacity="0.3" />

  <!-- Bar 1: Agents in Production - 57.3% -->
  <rect x="160" y="166.5" width="80" height="143.5" rx="4" fill="#f97316" />
  <text x="200" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#f97316">57.3%</text>
  <text x="200" y="335" text-anchor="middle" font-size="10" fill="#1f2937" opacity="0.8">Agents in</text>
  <text x="200" y="347" text-anchor="middle" font-size="10" fill="#1f2937" opacity="0.8">Production</text>

  <!-- Bar 2: Offline Evaluation - 52.4% -->
  <rect x="280" y="178.8" width="80" height="131.2" rx="4" fill="#38bdf8" />
  <text x="320" y="169" text-anchor="middle" font-size="14" font-weight="800" fill="#38bdf8">52.4%</text>
  <text x="320" y="335" text-anchor="middle" font-size="10" fill="#1f2937" opacity="0.8">Run Offline</text>
  <text x="320" y="347" text-anchor="middle" font-size="10" fill="#1f2937" opacity="0.8">Evaluations</text>

  <!-- Bar 3: Online Evaluation - 37.3% -->
  <rect x="400" y="216.7" width="80" height="93.3" rx="4" fill="#a78bfa" />
  <text x="440" y="207" text-anchor="middle" font-size="14" font-weight="800" fill="#a78bfa">37.3%</text>
  <text x="440" y="335" text-anchor="middle" font-size="10" fill="#1f2937" opacity="0.8">Run Online</text>
  <text x="440" y="347" text-anchor="middle" font-size="10" fill="#1f2937" opacity="0.8">Evaluations</text>

  <!-- Source -->
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#1f2937" opacity="0.35">Source: LangChain State of Agent Engineering (2025)</text>
</svg>
