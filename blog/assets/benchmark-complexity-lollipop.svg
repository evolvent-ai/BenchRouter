<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" style="max-width: 100%; height: auto; font-family: 'Inter', system-ui, sans-serif" role="img" aria-label="Horizontal bar chart comparing framework setup complexity: OpenEval requires 2 YAML files, VLMEvalKit requires framework code modification, Harbor requires adapter classes, and AgentBench requires hardcoded environments">
  <title>Framework Complexity: Cost to Add a New Benchmark</title>
  <desc>Horizontal lollipop chart showing the relative setup complexity of adding a new benchmark to different frameworks. OpenEval: 2 config files + 1 script (minimal). Harbor: adapter class + registry entry (moderate). VLMEvalKit: modify framework internals (high). AgentBench: hardcoded environment integration (very high).</desc>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Cost to Add a New Benchmark</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#1f2937" opacity="0.45">Relative setup complexity (lower is better)</text>

  <!-- Axis -->
  <line x1="200" y1="70" x2="200" y2="280" stroke="#1f2937" opacity="0.3" />

  <!-- Scale markers -->
  <line x1="200" y1="70" x2="540" y2="70" stroke="#1f2937" opacity="0.05" />
  <text x="200" y="65" text-anchor="middle" font-size="9" fill="#1f2937" opacity="0.5">0</text>
  <text x="285" y="65" text-anchor="middle" font-size="9" fill="#1f2937" opacity="0.5">Low</text>
  <text x="370" y="65" text-anchor="middle" font-size="9" fill="#1f2937" opacity="0.5">Medium</text>
  <text x="455" y="65" text-anchor="middle" font-size="9" fill="#1f2937" opacity="0.5">High</text>
  <text x="540" y="65" text-anchor="middle" font-size="9" fill="#1f2937" opacity="0.5">Very High</text>

  <!-- OpenEval -->
  <text x="195" y="110" text-anchor="end" font-size="12" font-weight="600" fill="#1f2937">OpenEval</text>
  <line x1="200" y1="106" x2="255" y2="106" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
  <circle cx="255" cy="106" r="8" fill="#22c55e" />
  <text x="270" y="110" font-size="10" fill="#1f2937" opacity="0.7">2 YAML files + 1 script</text>

  <!-- Harbor -->
  <text x="195" y="160" text-anchor="end" font-size="12" font-weight="600" fill="#1f2937">Harbor</text>
  <line x1="200" y1="156" x2="350" y2="156" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <circle cx="350" cy="156" r="8" fill="#38bdf8" />
  <text x="365" y="160" font-size="10" fill="#1f2937" opacity="0.7">Adapter class + registry</text>

  <!-- VLMEvalKit -->
  <text x="195" y="210" text-anchor="end" font-size="12" font-weight="600" fill="#1f2937">VLMEvalKit</text>
  <line x1="200" y1="206" x2="440" y2="206" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
  <circle cx="440" cy="206" r="8" fill="#f97316" />
  <text x="455" y="210" font-size="10" fill="#1f2937" opacity="0.7">Modify framework code</text>

  <!-- AgentBench -->
  <text x="195" y="260" text-anchor="end" font-size="12" font-weight="600" fill="#1f2937">AgentBench</text>
  <line x1="200" y1="256" x2="520" y2="256" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" />
  <circle cx="520" cy="256" r="8" fill="#a78bfa" />
  <text x="535" y="260" font-size="10" fill="#1f2937" opacity="0.7">Hardcoded env</text>

  <!-- Annotation -->
  <text x="255" y="125" font-size="9" fill="#22c55e" font-weight="600">← Minimal protocol contract</text>

  <!-- Source -->
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#1f2937" opacity="0.35">Source: OpenEval Team Analysis (2026)</text>
</svg>
