[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchrouter"
version = "0.4.0"
description = "Command-driven Evaluation-as-a-Service platform for LLM evaluation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "docker>=7.0.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
benchrouter = "benchrouter.client.cli:app"
benchrouter-server = "benchrouter.server.launch:main"

[tool.setuptools.packages.find]
include = ["benchrouter*"]
